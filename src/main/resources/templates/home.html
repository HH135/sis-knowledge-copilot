<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SIS App Intelligence</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #172033;
			background: #f4f6fa;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
		}

		header {
			background: #14213d;
			color: #fff;
			padding: 1.25rem max(1.5rem, calc((100% - 1080px) / 2));
		}

		header h1 {
			margin: 0;
			font-size: 1.25rem;
		}

		main {
			width: min(1080px, calc(100% - 3rem));
			margin: 4rem auto;
		}

		main h2 {
			margin: 0 0 0.5rem;
			font-size: 2rem;
		}

		main p {
			margin: 0 0 2rem;
			color: #586174;
		}

		nav ul {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 1rem;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		nav a {
			display: block;
			padding: 1.5rem;
			border: 1px solid #dce2ec;
			border-radius: 0.5rem;
			background: #fff;
			color: #14213d;
			font-weight: 600;
			text-decoration: none;
		}

		nav a:hover,
		nav a:focus-visible {
			border-color: #3563c7;
			color: #2451ad;
		}
	</style>
</head>
<body>
	<header>
		<h1>SIS App Intelligence</h1>
	</header>
	<main>
		<h2>Explore SIS</h2>
		<p>Choose an area to get started.</p>
		<nav aria-label="Main navigation">
			<ul>
				<li><a th:href="@{/source}">Source Explorer</a></li>
				<li><a th:href="@{/metadata}">Metadata Explorer</a></li>
				<li><a th:href="@{/documents}">Document Explorer</a></li>
			</ul>
		</nav>
	</main>
</body>
</html>
