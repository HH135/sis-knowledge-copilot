spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:schema-vector.sql
spring.config.import=optional:file:.env[.properties]
app.ai.embedding.provider=${APP_AI_EMBEDDING_PROVIDER:mock}
app.ai.external-enabled=${APP_AI_EXTERNAL_ENABLED:false}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.embedding-model=gemini-embedding-001
app.ai.gemini.dimensions=768
app.ai.gemini.batch-size=20
app.ai.gemini.request-interval-ms=1500
app.ai.gemini.max-input-chars=6000
