spring.application.name=sis-app-intelligence

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/sis_app_intelligence}
spring.datasource.username=${POSTGRES_USER:sis_app}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql